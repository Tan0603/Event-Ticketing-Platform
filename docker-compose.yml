x-php: &php
  build:
    context: ./docker/php
  image: ticketing-php:local
  working_dir: /var/www/html
  env_file: .env
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
    MAIL_HOST: mailpit
  volumes:
    - .:/var/www/html
    # vendor on a named volume: bind-mounting it from OneDrive/Windows is very slow
    - vendor:/var/www/html/vendor
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  app:
    <<: *php
    command: php-fpm

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]

  horizon:
    <<: *php
    command: php artisan horizon
    profiles: ["full"]

  scheduler:
    <<: *php
    command: php artisan schedule:work
    profiles: ["full"]

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: ticketing
    # Tuned for local dev + the 200-request stress test
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB
      -c work_mem=8MB -c synchronous_commit=off -c fsync=off
      -c full_page_writes=off -c lock_timeout=0
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketing"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"

volumes:
  vendor:
  postgres-data:
  redis-data:
